<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情墙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 { text-align: center; color: #5a4a3a; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #a08c7a; margin-bottom: 30px; font-size: 14px; }

  /* ===== 发帖区 ===== */
  #note-form {
    max-width: 420px; margin: 0 auto 40px;
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 4px 12px rgba(90,74,58,.12);
    display: flex; flex-direction: column; gap: 12px;
  }
  #note-form input, #note-form textarea {
    border: 1px solid #e0d5c5; border-radius: 8px;
    padding: 10px 12px; font-size: 15px; font-family: inherit;
    outline: none; resize: vertical;
  }
  #note-form input:focus, #note-form textarea:focus { border-color: #d4a853; }
  #note-form textarea { min-height: 80px; }
  #note-form button {
    background: #d4a853; color: #fff; border: none; border-radius: 8px;
    padding: 12px; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  #note-form button:hover { background: #c4973f; }

  /* ===== 便签墙 ===== */
  #wall {
    max-width: 1000px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .note {
    padding: 16px; border-radius: 4px; min-height: 120px;
    box-shadow: 2px 3px 8px rgba(0,0,0,.15);
    display: flex; flex-direction: column; gap: 8px;
    word-break: break-word;
  }
  .note .name { font-weight: bold; font-size: 15px; }
  .note .text { flex: 1; font-size: 14px; line-height: 1.6; }
  .note .time { font-size: 12px; opacity: .6; text-align: right; }
</style>
</head>
<body>
  <h1>📌 心情墙</h1>
  <p class="subtitle">贴一张纸条，服务器烧了它都在</p>

  <form id="note-form">
    <input id="name" placeholder="你的名字" maxlength="20" required>
    <textarea id="text" placeholder="今天心情怎么样？" maxlength="200" required></textarea>
    <button type="submit">贴上墙</button>
  </form>

  <div id="wall"></div>

<script>
// ================= 我写的工具函数（你先用着） =================

// 把一张纸条渲染成一个便签 DOM，挂到墙上
function addNoteToWall(note, index) {
  const colors = ["#fff9c4", "#ffe0e6", "#d7f0e0", "#dde9ff", "#f3e2ff"];
  const card = document.createElement("div");
  card.className = "note";
  card.style.background = colors[index % colors.length];   // 颜色轮着用
  card.style.transform = `rotate(${(index % 5) - 2}deg)`;  // 微微歪斜，像真便签

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = note.name;   // 用 textContent：坏蛋写 <script> 也只会变成文字
                                  // （和占位符防注入一个道理：内容永远只是内容）

  const text = document.createElement("div");
  text.className = "text";
  text.textContent = note.text;

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = note.time;

  card.append(name, text, time);
  document.querySelector("#wall").append(card);
}

// ================= 练习区：这两个函数你来写 =================

// 【练习1】把墙上的纸条从服务器取回来
// 提示：天气项目里你写过几乎一样的 fetch。
//   1. fetch("/api/notes")  —— 敲自己服务器的门（地址栏同源，写相对路径就行）
//   2. 第一个 .then 里拆包：r => r.json()
//   3. 第二个 .then 里拿到纸条数组 notes，先清空墙：
//        document.querySelector("#wall").innerHTML = "";
//      然后 notes.forEach((note, i) => addNoteToWall(note, i))
async function loadNotes() {   //看到await报错说明要加async
const res = await fetch("/api/notes"); //定义一个res的变量，表示从服务器寄来的一个东西，await搭配async指await fetch（...)包裹要等一会才能到，先挂着，到了再继续，其他页面照常。只有async出现才可以有await。也就是先挂“async”这个牌子，才可以等待
const notes = await res.json(); //定义一个notes的变量，并且用res.json()的方式拆包，如果前面我变动res，json前面的变量名也要改
document.querySelector("#wall").innerHTML = "";  //页面.找到wall里面的东西.然后将其清空。document是页面对象querySelector是查找工具 innerHTML是内置的属性或者方法。都是官方变量名
notes.forEach((note, i) => addNoteToWall(note, i)); //对于每一个notes都叫它们note，序号是i，把它们搞到墙上=>是一个临时小函数
}

// 页面一打开就贴一次墙
loadNotes();

// 【练习2】表单提交：把新纸条寄给服务器
// 提示：上周你在控制台写过几乎一样的 POST，还记得吗？
//   1. 先从输入框取值：
//        const name = document.querySelector("#name").value;
//        const text = document.querySelector("#text").value;
//   2. fetch("/api/notes", { method: "POST",
//        headers: {"Content-Type": "application/json"},
//        body: JSON.stringify({name: name, text: text}) })
//   3. 成功之后：清空两个输入框，再调用 loadNotes() 重新贴墙
// 注意：e.preventDefault() 是给表单的"别刷新页面"咒语，别删
document.querySelector("#note-form").addEventListener("submit",async (e) => {
  e.preventDefault();//找到表单，装个监听器：一旦有人提交（submit），就执行后面这个函数"。addEventListener = 装监听器，"submit" = 监听"提交"这件事。
  //e是事件包裹，里面是“刚刚发生了什么”的详细信息。preventDefault表示不要按默认流程走，就是提交后刷新整个页面跳转走，我们不想让它刷新，这样JS状态全没了，所以我们先拦住，再用fetch的方式悄悄寄走
  //e是快递员，preventDefault说的是不要按老规矩敲门了，我自己来收。
  const name = document.querySelector("#name").value;  //先定义name，想知道打了什么字，内容是名字.value也是官方语言
  const text = document.querySelector("#text").value;  //先定义text，想知道我具体输入了什么
  await fetch("/api/notes",{  //敲这个门，根据要干什么事，开了什么门选择不同功能的门
    method: "POST", //用POST的方式敲门，用GET方式敲门，服务器以为你要看墙，于是把所有纸条给你，但是这样寄的纸条包裹会被无视
    headers: {"Content-Type": "application/json"}, //headers代表物品类型栏，告诉服务器包裹里是JSON，要用get_json拆，没有这个服务器可能拆错包裹。浏览器:JSON.stringify和服务器:get_json是一对打包拆包.
    //服务器jsonify和浏览器res.json是一对打包拆包
    body: JSON.stringify({name: name,text: text})  //将包裹压缩成一段JSON文字寄走
  })
document.querySelector("#name").value = "";  //将“名字”部分变为空
document.querySelector("#text").value = ""; //将“内容”部分变为空
loadNotes(); //调用函数，重新将新的纸条取出来
});
</script>
</body>
</html>
